<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Geist, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C26A4C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="470" rx="20" fill="#F1ECDE"/>

  <!-- Header -->
  <text x="40" y="46" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="3" fill="#736C63">TELOS · NOMOS — ARCHITEKTUR</text>

  <!-- Stage 1: Browser -->
  <rect x="40" y="80" width="250" height="160" rx="16" fill="#F7F2E7" stroke="#DCD3BB"/>
  <text x="60" y="110" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#736C63">1 · IM BROWSER</text>
  <text x="60" y="134" font-size="16" font-weight="600" fill="#26221C">Telos · Web-Oberfläche</text>
  <text x="60" y="164" font-family="JetBrains Mono, monospace" font-size="12" fill="#46403A">Pitch / Businessplan</text>
  <text x="60" y="186" font-family="JetBrains Mono, monospace" font-size="12" fill="#46403A">PDF · DOCX · Text</text>
  <text x="60" y="208" font-family="JetBrains Mono, monospace" font-size="12" fill="#46403A">kein API-Key im Browser</text>

  <!-- Stage 2: Backend (dark) -->
  <rect x="355" y="80" width="250" height="160" rx="16" fill="#26221C"/>
  <text x="375" y="110" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="rgba(245,240,230,0.55)">2 · SICHERES BACKEND</text>
  <text x="375" y="134" font-size="16" font-weight="600" fill="#F7F2E7">Node · Express</text>
  <text x="375" y="162" font-family="JetBrains Mono, monospace" font-size="11.5" fill="rgba(245,240,230,0.8)">/api/analyze · /api/translate</text>
  <text x="375" y="182" font-family="JetBrains Mono, monospace" font-size="11.5" fill="rgba(245,240,230,0.8)">/api/livesearch · /api/generate</text>
  <text x="375" y="210" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#D5A55B">ANTHROPIC_API_KEY (nur hier)</text>

  <!-- Stage 3: Claude -->
  <rect x="670" y="80" width="250" height="160" rx="16" fill="#F7F2E7" stroke="#DCD3BB"/>
  <text x="690" y="110" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#736C63">3 · KI-ENGINE</text>
  <text x="690" y="134" font-size="16" font-weight="600" fill="#26221C">Claude (Opus 4.7 /</text>
  <text x="690" y="153" font-size="16" font-weight="600" fill="#26221C">Sonnet 4.6)</text>
  <text x="690" y="180" font-family="JetBrains Mono, monospace" font-size="12" fill="#46403A">adaptive thinking</text>
  <text x="690" y="202" font-family="JetBrains Mono, monospace" font-size="12" fill="#46403A">prompt caching</text>
  <text x="690" y="224" font-family="JetBrains Mono, monospace" font-size="12" fill="#46403A">strukturierte Outputs</text>

  <!-- Arrows main flow -->
  <line x1="292" y1="160" x2="353" y2="160" stroke="#C26A4C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="298" y="150" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1" fill="#736C63">HTTPS</text>
  <line x1="607" y1="160" x2="668" y2="160" stroke="#C26A4C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="150" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1" fill="#736C63">API</text>

  <!-- Data sources feeding backend -->
  <rect x="355" y="280" width="120" height="78" rx="14" fill="#F7F2E7" stroke="#4D6A8B"/>
  <text x="372" y="306" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.5" fill="#4D6A8B">DATENQUELLE</text>
  <text x="372" y="326" font-size="13" font-weight="600" fill="#26221C">Förder-DB</text>
  <text x="372" y="345" font-size="11" fill="#46403A">Bund · Länder · EU</text>

  <rect x="485" y="280" width="120" height="78" rx="14" fill="#F7F2E7" stroke="#4D6A8B"/>
  <text x="502" y="306" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.5" fill="#4D6A8B">DATENQUELLE</text>
  <text x="502" y="326" font-size="13" font-weight="600" fill="#26221C">Web-Suche</text>
  <text x="502" y="345" font-size="11" fill="#46403A">web_search</text>

  <line x1="430" y1="280" x2="460" y2="242" stroke="#C8BD9F" stroke-width="1.5"/>
  <line x1="530" y1="280" x2="500" y2="242" stroke="#C8BD9F" stroke-width="1.5"/>

  <!-- Return channel -->
  <rect x="40" y="392" width="880" height="44" rx="14" fill="#E8E1CE"/>
  <path d="M62 420 V408 A 10 10 0 0 1 82 408 V420" stroke="#C26A4C" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <text x="100" y="419" font-family="JetBrains Mono, monospace" font-size="11.5" letter-spacing="1" fill="#46403A">RÜCKKANAL · gestreamt  →  Analyse · Übersetzung · Antragsentwurf</text>

  <!-- Caption -->
  <text x="690" y="419" font-size="11" fill="#736C63">Key bleibt serverseitig — nie im Browser.</text>
</svg>
