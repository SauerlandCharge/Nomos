<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ───────────────────────────── Brand atoms ───────────────────────────── */

}

// Bridge arc — vision → bescheid
function ArcMark({ size=96, color='var(--terracotta)', stroke }) {
  const sw = stroke || size*0.085;

    <svg width={size} height={size*0.62} viewBox="0 0 100 62" fill="none" style={{ overflow:'visible' }}>
      <path d="M6 56 V28 A 44 44 0 0 1 94 28 V56" stroke={color} strokeWidth={sw} strokeLinecap="round" fill="none" />

}

// Nomos engine glyph — structure imposed on chaos
function NomosMark({ size=80, color='var(--cream-100)' }) {
  const sw = size*0.13;
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" fill="none">
      <rect x="8" y="22" width="26" height={sw} rx={sw/2} fill={color} opacity="0.55" />
      <rect x="14" y="46" width="20" height={sw} rx={sw/2} fill={color} opacity="0.75" />
      <rect x="8" y="70" width="26" height={sw} rx={sw/2} fill={color} opacity="0.55" />
      <rect x="46" y="22" width={sw} height="62" rx={sw/2} fill={color} />
      <rect x="62" y="22" width="30" height={sw} rx={sw/2} fill={color} />
      <rect x="62" y="46" width="30" height={sw} rx={sw/2} fill={color} />
      <rect x="62" y="70" width="30" height={sw} rx={sw/2} fill={color} />

}

const Eyebrow = ({ children, className='' }) => (
  <div className={"brand-mono uppercase text-ink-500 "+className} style={{ fontSize:10, letterSpacing:'0.18em' }}>{children}</div>
);

function NomosBadge() {

    </span>

/* ───────────────────────── Translation engine ─────────────────────────
   A lightweight, deterministic "founder-slang → Behördendeutsch" transform.
   Demo-grade: phrase substitution + a formal framing clause. */

const WORD_MAP = [
  [/\bwir (bauen|machen|basteln|entwickeln)\b/gi, 'Gegenstand des Vorhabens ist die Entwicklung von'],
  [/\bdisrupt(en|et|ed|)\b/gi, 'grundlegend transformiert'],
  [/\bskalier(en|t|ung)\b/gi, 'in den Markt überführt'],
  [/\bgame[- ]?changer\b/gi, 'paradigmenwechselnde Lösung'],
  [/\bmassiv\b/gi, 'in erheblichem Umfang'],
  [/\bkrass\b/gi, 'in signifikantem Maße'],
  [/\bmega\b/gi, 'außerordentlich'],
  [/\bcool\b/gi, 'vorteilhaft'],
  [/\bsuper\b/gi, 'besonders'],
  [/\beinfach mal\b/gi, 'systematisch'],
  [/\bplug[- ]?(and|&|n)[- ]?play\b/gi, 'unmittelbar einsatzbereites'],
  [/\bapp\b/gi, 'Softwareanwendung'],
  [/\bki\b/gi, 'künstlicher Intelligenz'],
  [/\bai\b/gi, 'künstlicher Intelligenz'],
  [/\btool\b/gi, 'Instrument'],
  [/\bstartups?\b/gi, 'junge Technologieunternehmen'],
  [/\bgründer\b/gi, 'antragstellende Personen'],
  [/\bkunden?\b/gi, 'Adressatinnen und Adressaten'],
  [/\bnutzer\b/gi, 'Anwenderinnen und Anwender'],
  [/\bmarkt\b/gi, 'relevante Zielmarkt'],
  [/\bbattery|akku\b/gi, 'Energiespeichersystem'],
  [/\bsolar(anlage)?\b/gi, 'Photovoltaikanlage'],
  [/\bhausbesitzer\b/gi, 'Eigentümerinnen und Eigentümer von Bestandsimmobilien'],
  [/\bbestehende\b/gi, 'im Bestand befindliche'],
  [/\bschnell\b/gi, 'mit hoher Effizienz'],
  [/\bbillig(er)?\b/gi, 'kostengünstiger'],
  [/\bgeil\b/gi, 'überzeugend'],
  [/\briesig\b/gi, 'beträchtlich'],
  [/\bproblem\b/gi, 'identifizierte Problemstellung'],
  [/\blösen\b/gi, 'einer strukturierten Lösung zuführen'],
  [/\bidee\b/gi, 'Vorhabenskonzeption'],
  [/!+/g, '.'],
];

function toFormal(text) {
  let t = (text || '').trim();
  if (!t) return '';
  WORD_MAP.forEach(([re, rep]) => { t = t.replace(re, rep); });
  // strip leftover hype quotes & collapse spaces
  t = t.replace(/[„"”]/g,'').replace(/\s+/g,' ').trim();
  // lowercase first letter to splice into framing clause
  const body = t.charAt(0).toLowerCase() + t.slice(1);
  const tail = /[.?!]$/.test(body) ? body : body + '.';
  return `Im Rahmen des beabsichtigten Vorhabens beabsichtigt die antragstellende Einrichtung, ${tail} Die Umsetzung erfolgt strukturiert und nachvollziehbar gemäß den einschlägigen Förderrichtlinien.`;
}

/* ───────────────────────────── Grant data ───────────────────────────── */

const GRANTS = [
  { id:'kmu',    name:'BMWK — KMU-innovativ: Klimaschutz', region:'DE · Bund',   amount:'bis 2,5 Mio €', rate:'50 %', color:'var(--terracotta)',
    tags:['klima','klimaschutz','co2','energie','solar','photovoltaik','speicher','nachhaltig','umwelt','grün','wärme'] },
  { id:'horizon',name:'EU Horizon Europe — Cluster 5 Energy', region:'EU · Brüssel', amount:'bis 4,0 Mio €', rate:'70 %', color:'var(--honey)',
    tags:['energie','solar','wasserstoff','klima','mobilität','speicher','netz','forschung','europa'] },
  { id:'baytou', name:'Bayern Innovativ — BayTOU',       region:'DE · Bayern', amount:'bis 250 Tsd €', rate:'40 %', color:'var(--cobalt)',
    tags:['software','technologie','hardware','prototyp','ki','bayern','gründung'] },
  { id:'exist',  name:'EXIST-Forschungstransfer',        region:'DE · Bund',   amount:'bis 3,0 Mio €', rate:'100 %', color:'var(--terracotta)',
    tags:['forschung','hochschule','gründung','technologie','ki','wissenschaft','transfer','prototyp'] },
  { id:'zim',    name:'ZIM — Innovationsprogramm Mittelstand', region:'DE · Bund', amount:'bis 550 Tsd €', rate:'45 %', color:'var(--honey)',
    tags:['software','hardware','ki','technologie','produktion','industrie','mittelstand','prototyp'] },
  { id:'godig',  name:'go-digital — Digitalisierung',     region:'DE · Bund',   amount:'bis 16,5 Tsd €', rate:'50 %', color:'var(--cobalt)',
    tags:['software','digitalisierung','ki','app','plattform','daten','online'] },
  { id:'profit', name:'Berlin — Pro FIT Frühphase',       region:'DE · Berlin', amount:'bis 1,0 Mio €', rate:'70 %', color:'var(--terracotta)',
    tags:['software','ki','gesundheit','mobilität','plattform','berlin','daten','medizin'] },
  { id:'eic',    name:'EIC Accelerator',                  region:'EU · Brüssel', amount:'bis 2,5 Mio € + Equity', rate:'70 %', color:'var(--honey)',
    tags:['deeptech','ki','gesundheit','klima','energie','medizin','forschung','europa','skalierung'] },
];

// generic triggers so every realistic pitch matches something
const GENERIC = ['entwickeln','plattform','innovation','markt','kunden','technologie','software','prototyp','daten','digital'];

function matchGrants(text) {
  const t = (text || '').toLowerCase();
  const scored = GRANTS.map(g => {
    let hits = 0;
    g.tags.forEach(tag => { if (t.includes(tag)) hits += 2; });
    GENERIC.forEach(w => { if (t.includes(w)) hits += 0.4; });
    // deterministic jitter per grant id
    const jitter = (g.id.charCodeAt(0) + g.id.charCodeAt(1)) % 7;
    const fit = Math.max(58, Math.min(96, Math.round(62 + hits * 6 + jitter)));
    return { ...g, fit, hits };
  });
  return scored.sort((a,b) => b.fit - a.fit);
}

/* sample pitches */
const SAMPLES = [
  { proj:'Helios', text:'Wir bauen eine Plug-&-Play-Battery, die jeder Hausbesitzer an seine bestehende Solaranlage hängen kann. Massiv günstiger als alles am Markt — und in 20 Minuten installiert. Das wird den Klimaschutz-Markt disrupten.' },

/* ───────────────────────────── Shell ───────────────────────────── */

function App() {
  const [view, setView] = useState('landing'); // landing | analyze | dashboard | antrag
  const [proj, setProj] = useState('');
  const [pitch, setPitch] = useState('');
  const [matches, setMatches] = useState([]);
  const [selected, setSelected] = useState(null);

  const startAnalysis = () => {
    setMatches(matchGrants(pitch));
    setView('analyze');
  };

  const reset = () => { setView('landing'); setSelected(null); };

  return (
    <div className="min-h-screen bg-cream-100">
      <Nav view={view} onHome={reset} />
      {view === 'landing'  && <Landing proj={proj} setProj={setProj} pitch={pitch} setPitch={setPitch} onAnalyze={startAnalysis} />}
      {view === 'analyze'  && <Analyzing proj={proj} pitch={pitch} onDone={() => setView('dashboard')} />}
      {view === 'dashboard'&& <Dashboard proj={proj} pitch={pitch} matches={matches}
                                onSelect={(g)=>{ setSelected(g); setView('antrag'); }} />}
      {view === 'antrag'   && <Antrag proj={proj} pitch={pitch} grant={selected}
                                onBack={()=>setView('dashboard')} onReset={reset} />}
      <Footer />
    </div>

}

/* ───────────────────────────── Landing / Hero ───────────────────────────── */

          <p className="mt-6 max-w-md text-lg leading-relaxed text-ink-700">

            <div className="mt-3 flex flex-wrap items-center gap-2">

/* ───────────────────────────── Analyzing ───────────────────────────── */

const STEPS = [
  'Pitch-Dokument wird eingelesen …',
  'Semantische Merkmale werden extrahiert …',
  '1.247 Förderlinien werden abgeglichen …',
  'Hyperlokales Matching (Bund · Land · EU) …',
  'Konfidenz-Scoring der Treffer …',
];

function Analyzing({ proj, pitch, onDone }) {
  const [step, setStep] = useState(0);
  useEffect(() => {
    if (step < STEPS.length) {
      const t = setTimeout(() => setStep(s => s+1), 620);
      return () => clearTimeout(t);
    }
    const t = setTimeout(onDone, 500);
    return () => clearTimeout(t);
  }, [step]);

  const pct = Math.round((step / STEPS.length) * 100);

  return (
    <main className="anim-fadein mx-auto flex min-h-[70vh] max-w-2xl flex-col items-center justify-center px-6 text-center">
      <div className="relative flex h-28 w-28 items-center justify-center rounded-3xl bg-ink-900">
        <div className="scan-line" />
        <div className="spin"><NomosMark size={56} color="var(--cream-100)" /></div>
      </div>
      <Eyebrow className="mt-8">NOMOS · ENGINE v1.0</Eyebrow>
      <h2 className="mt-2 font-sans" style={{ fontSize:32, fontWeight:500, letterSpacing:'-0.03em' }}>
        Analysiere „{proj || 'dein Vorhaben'}“ …
      </h2>

      <div className="mt-8 w-full max-w-md">
        <div className="h-1.5 w-full overflow-hidden rounded-full bg-cream-300">
          <div className="h-full rounded-full bg-terracotta transition-all duration-500" style={{ width:`${pct}%` }} />
        </div>
        <div className="mt-6 flex flex-col gap-2.5 text-left">
          {STEPS.map((s,i) => (
            <div key={i} className="flex items-center gap-3 transition-opacity" style={{ opacity: i <= step ? 1 : 0.3 }}>
              <span className="brand-mono" style={{ fontSize:12, color: i < step ? 'var(--terracotta)' : 'var(--ink-500)' }}>
                {i < step ? '✓' : (i === step ? <span className="dot-pulse">●</span> : '○')}
              </span>
              <span className="brand-mono text-ink-700" style={{ fontSize:12 }}>{s}</span>
            </div>
          ))}
        </div>
      </div>
    </main>
  );
}

/* ───────────────────────────── Dashboard ───────────────────────────── */

function Dashboard({ proj, pitch, matches, onSelect }) {
  const top = matches.slice(0, 6);
  const formal = useMemo(() => toFormal(pitch), [pitch]);

  return (
    <main className="anim-fadein mx-auto grid max-w-7xl gap-0 px-0 md:grid-cols-[230px_1fr] md:px-12 md:py-8">
      {/* sidebar */}
      <aside className="hidden flex-col gap-6 rounded-l-3xl border-y border-l border-cream-300 bg-cream-200 p-5 md:flex">
        <div className="flex flex-col gap-1">
          <SideItem icon="●" label="Dashboard" />
          <SideItem icon="◐" label="Mein Pitch" active />
          <SideItem icon="◇" label="Förderlinien" badge={String(matches.length)} />
          <SideItem icon="◆" label="Anträge" badge="0" />
          <SideItem icon="○" label="Übersetzungen" />
        </div>
        <div className="mt-auto rounded-2xl border border-cream-300 bg-cream-50 p-3">
          <div className="flex items-center gap-2">
            <NomosMark size={16} color="var(--ink-900)" />
            <span className="brand-mono" style={{ fontSize:10, letterSpacing:'0.14em' }}>NOMOS · v1.0</span>
          </div>
          <div className="brand-mono mt-2 leading-relaxed text-ink-500" style={{ fontSize:10 }}>
            Engine bereit ·<br/>2,8 Mrd. € analysiert
          </div>
        </div>
      </aside>

      {/* main */}
      <section className="flex flex-col gap-5 border-y border-cream-300 bg-cream-100 p-6 md:rounded-r-3xl md:border-r">
        <div className="flex flex-wrap items-end justify-between gap-3">
          <div>
            <span className="brand-mono uppercase text-ink-500" style={{ fontSize:10, letterSpacing:'0.14em' }}>
              MEIN PITCH · {proj ? proj.replace(/\s+/g,'-') : 'Vorhaben'}-Q2-2026.pdf
            </span>
            <h2 className="mt-1 font-sans" style={{ fontSize:28, fontWeight:500, letterSpacing:'-0.025em' }}>
              {proj || 'Dein Vorhaben'}
            </h2>
          </div>
          <span className="brand-mono flex items-center gap-1.5 text-terracotta" style={{ fontSize:10 }}>
            <span className="dot-pulse">●</span> {matches.length} TREFFER · LIVE
          </span>
        </div>

        {/* matches */}
        <div className="rounded-3xl border border-cream-300 bg-cream-50 p-5">
          <div className="mb-3 flex items-center justify-between">
            <span className="brand-mono uppercase text-ink-500" style={{ fontSize:10, letterSpacing:'0.14em' }}>
              HYPERLOKALES MATCHING · {top.length} PASSENDE TÖPFE
            </span>
            <span className="brand-mono text-ink-500" style={{ fontSize:10 }}>SORTIERT NACH KONFIDENZ</span>
          </div>
          <div className="flex flex-col gap-2">
            {top.map((g,i) => <MatchRow key={g.id} g={g} delay={i*60} onSelect={()=>onSelect(g)} />)}
          </div>
        </div>

        {/* translation row */}
        <div>
          <Eyebrow className="mb-3">SCHRITT 2 · NOMOS-ÜBERSETZUNG</Eyebrow>
          <div className="grid items-stretch gap-3 md:grid-cols-[1fr_48px_1fr]">
            <Panel label="DEIN PITCH · ORIGINAL">
              <span className="text-sm leading-relaxed text-ink-900">{pitch || '—'}</span>
            </Panel>
            <div className="flex items-center justify-center"><ArcMark size={32} color="var(--terracotta)" /></div>
            <Panel label="NOMOS · BEHÖRDEN-FASSUNG" dark>
              <span className="text-sm leading-relaxed">{formal || '—'}</span>
            </Panel>
          </div>
          <p className="mt-3 text-sm text-ink-700">
            Wähle oben eine Förderlinie, um <strong>80&nbsp;% des offiziellen Antrags</strong> generieren zu lassen.
          </p>
        </div>
      </section>
    </main>
  );
}

function SideItem({ icon, label, active, badge }) {
  return (
    <div className={"flex items-center gap-2.5 rounded-lg px-2.5 py-2 "+(active ? "border border-cream-300 bg-cream-50" : "border border-transparent")}>
      <span style={{ fontSize:11, color: active ? 'var(--terracotta)' : 'var(--ink-500)' }}>{icon}</span>
      <span className="flex-1 text-sm" style={{ color: active ? 'var(--ink-900)':'var(--ink-700)', fontWeight: active ? 500:400 }}>{label}</span>
      {badge && <span className="brand-mono text-ink-500" style={{ fontSize:10 }}>{badge}</span>}
    </div>
  );
}

function MatchRow({ g, delay, onSelect }) {
  return (
    <div className="anim-fadeup grid grid-cols-1 items-center gap-3 rounded-xl border border-cream-200 bg-cream-100 p-3.5 transition-shadow hover:shadow-[0_8px_24px_-12px_rgba(40,30,20,0.25)] sm:grid-cols-[1.5fr_0.9fr_1fr_auto]"
      style={{ animationDelay:`${delay}ms` }}>
      <div>
        <div className="text-sm font-medium text-ink-900">{g.name}</div>
        <div className="brand-mono mt-0.5 text-ink-500" style={{ fontSize:10, letterSpacing:'0.1em' }}>{g.region}</div>
      </div>
      <div className="text-xs text-ink-700">{g.amount}</div>
      <div className="flex items-center gap-2.5">
        <div className="h-1 flex-1 rounded-full bg-cream-300">
          <div className="h-full rounded-full" style={{ width:`${g.fit}%`, background:g.color }} />
        </div>
        <span className="brand-mono text-ink-700" style={{ fontSize:11 }}>{g.fit}%</span>
      </div>
      <button onClick={onSelect}
        className="justify-self-start rounded-full bg-ink-900 px-3.5 py-2 text-xs font-medium text-cream-100 transition-transform hover:scale-[1.04] sm:justify-self-end">
        Antrag starten →
      </button>
    </div>
  );
}

function Panel({ label, dark, children }) {
  return (
    <div className={"rounded-2xl p-4 "+(dark ? "bg-ink-900 text-cream-100" : "border border-cream-300 bg-cream-50 text-ink-900")}>
      <div className="brand-mono mb-2" style={{ fontSize:10, letterSpacing:'0.14em', color: dark ? 'rgba(245,240,230,0.55)' : 'var(--ink-500)' }}>{label}</div>
      {children}
    </div>
  );
}

/* ───────────────────────────── Antrag generation ───────────────────────────── */

function buildSections(proj, pitch, grant) {
  const P = proj || 'das Vorhaben';
  const formal = toFormal(pitch);
  return [
    { t:'1 · Kurzbeschreibung des Vorhabens', conf:95, body:
      `Gegenstand des beantragten Vorhabens „${P}“ ist die Forschung und Entwicklung einer neuartigen technologischen Lösung. ${formal} Das Vorhaben wird im Rahmen der Förderlinie „${grant.name}“ (${grant.region}) durchgeführt und adressiert ein nachweisbares technologisches sowie wirtschaftliches Innovationspotenzial.` },
    { t:'2 · Ausgangslage und Problemstellung', conf:92, body:
      `Die gegenwärtige Marktsituation ist durch erhebliche Effizienz- und Strukturdefizite gekennzeichnet. Bestehende Lösungsansätze genügen den Anforderungen an Skalierbarkeit, Wirtschaftlichkeit und Nachhaltigkeit nur unzureichend. Hieraus ergibt sich ein konkreter Handlungsbedarf, dem das Vorhaben „${P}“ durch einen neuartigen technologischen Ansatz systematisch begegnet.` },
    { t:'3 · Ziele des Vorhabens', conf:94, list:[
      'Entwicklung eines funktionsfähigen Prototyps bis zum Projektmonat 12.',
      'Validierung der technischen Machbarkeit unter realitätsnahen Einsatzbedingungen.',
      'Überführung der Projektergebnisse in ein marktreifes, skalierbares Produkt.',
      'Schaffung qualifizierter Arbeitsplätze am Wirtschaftsstandort.' ] },
    { t:'4 · Innovationsgehalt und Stand der Technik', conf:90, body:
      `Das Vorhaben hebt sich vom gegenwärtigen Stand der Technik durch einen signifikant höheren Wirkungsgrad sowie eine neuartige Systemarchitektur ab. Eine Recherche einschlägiger Schutzrechte sowie wissenschaftlicher Publikationen bestätigt den über den Stand der Technik hinausgehenden Charakter der angestrebten Lösung. Das technische Risiko gilt als beherrschbar und rechtfertigt die beantragte Förderung.` },
    { t:'5 · Arbeitsplan und Meilensteine', conf:91, list:[
      'AP 1 — Anforderungsanalyse und Spezifikation (M1–M3).',
      'AP 2 — Konzeption und Systemarchitektur (M3–M6).',
      'AP 3 — Prototypische Umsetzung der Kernkomponenten (M6–M12).',
      'AP 4 — Validierung, Test und Optimierung (M12–M18).',
      'AP 5 — Vorbereitung der wirtschaftlichen Verwertung (M18–M24).' ] },
    { t:'6 · Verwertungsplan', conf:89, body:
      `Die wirtschaftliche Verwertung erfolgt durch den Vertrieb des entwickelten Produkts an die definierte Zielgruppe sowie durch Lizenzierungsmodelle. Es wird ein nachhaltiges Umsatzwachstum innerhalb von drei Jahren nach Projektabschluss prognostiziert. Die wissenschaftliche Verwertung umfasst Publikationen sowie die Sicherung gewerblicher Schutzrechte.` },
  ];
}

function FinanzTable({ grant }) {
  const rows = [
    ['Personalkosten','312.000 €'],
    ['Sachkosten / Material','86.500 €'],
    ['Fremdleistungen','54.000 €'],
    ['Gemeinkosten (Pauschale)','78.500 €'],
  ];
  return (
    <div className="overflow-hidden rounded-xl border border-cream-300">
      {rows.map(([k,v],i) => (
        <div key={k} className={"flex items-center justify-between px-4 py-2.5 text-sm "+(i%2 ? 'bg-cream-100':'bg-cream-50')}>
          <span className="text-ink-700">{k}</span>
          <span className="brand-mono text-ink-900" style={{ fontSize:13 }}>{v}</span>
        </div>
      ))}
      <div className="flex items-center justify-between border-t border-cream-300 bg-ink-900 px-4 py-3 text-cream-100">
        <span className="text-sm font-medium">Gesamtvolumen · beantragte Quote {grant.rate}</span>
        <span className="brand-mono" style={{ fontSize:14 }}>531.000 €</span>
      </div>
    </div>
  );
}

function Antrag({ proj, pitch, grant, onBack, onReset }) {
  const sections = useMemo(() => buildSections(proj, pitch, grant), [proj, pitch, grant]);
  const total = sections.length + 1; // +1 finance section
  const [revealed, setRevealed] = useState(0);

  useEffect(() => {
    setRevealed(0);
    let n = 0;
    const id = setInterval(() => {
      n += 1;
      setRevealed(n);
      if (n >= total) clearInterval(id);
    }, 700);
    return () => clearInterval(id);
  }, [grant]);

  const done = revealed >= total;
  const pct = Math.round((revealed / total) * 80); // Nomos handles up to 80%

  return (
    <main className="anim-fadein mx-auto max-w-4xl px-6 pb-24 pt-8 md:px-12">
      {/* command bar */}
      <div className="no-print mb-6 flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-cream-300 bg-cream-50 px-5 py-4">
        <div className="flex items-center gap-3">
          <NomosMark size={22} color="var(--ink-900)" />
          <div>
            <div className="brand-mono uppercase text-ink-500" style={{ fontSize:10, letterSpacing:'0.14em' }}>ANTRAG · GENERIERT VON NOMOS</div>
            <div className="text-sm font-medium">{grant.name}</div>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={onBack} className="rounded-full border border-cream-400 px-4 py-2 text-sm text-ink-900 transition-colors hover:border-ink-900">← Förderlinien</button>
          <button onClick={()=>window.print()} disabled={!done}
            className="rounded-full bg-ink-900 px-4 py-2 text-sm font-medium text-cream-100 transition-all enabled:hover:scale-[1.03] disabled:opacity-30">
            Als PDF exportieren
          </button>
        </div>
      </div>

      {/* progress */}
      <div className="no-print mb-8 rounded-2xl bg-ink-900 p-5 text-cream-100">
        <div className="flex items-center justify-between">
          <span className="brand-mono" style={{ fontSize:11, letterSpacing:'0.14em', color:'rgba(245,240,230,0.65)' }}>
            {done ? 'FERTIG · 80% AUTOMATISCH ERSTELLT' : 'NOMOS GENERIERT …'}
          </span>
          <span className="brand-mono" style={{ fontSize:11, color:'var(--honey)' }}>{pct}%</span>
        </div>
        <div className="mt-3 h-1.5 w-full overflow-hidden rounded-full bg-white/10">
          <div className="h-full rounded-full bg-honey transition-all duration-500" style={{ width:`${pct}%` }} />
        </div>
        {done && (
          <p className="anim-fadein mt-3 text-sm leading-relaxed text-cream-300">
            Die verbleibenden 20&nbsp;% (persönliche Angaben, rechtsverbindliche Unterschriften, Anlagen)
            ergänzt du selbst. Nomos hat Struktur, Sprache und Inhalt vorbereitet.
          </p>
        )}
      </div>

      {/* document */}
      <article className="rounded-3xl border border-cream-300 bg-cream-50 p-8 md:p-12">
        <header className="mb-8 border-b border-cream-300 pb-6">
          <div className="brand-mono uppercase text-ink-500" style={{ fontSize:10, letterSpacing:'0.16em' }}>
            FÖRDERANTRAG · {grant.region} · ENTWURF
          </div>
          <h1 className="mt-3 font-sans" style={{ fontSize:34, fontWeight:500, letterSpacing:'-0.03em', lineHeight:1.05 }}>
            Antrag auf Gewährung einer Zuwendung<br/>
            <span className="brand-serif italic text-ink-700" style={{ fontWeight:400, fontSize:24 }}>
              für das Vorhaben „{proj || 'Vorhaben'}“
            </span>
          </h1>
        </header>

        <div className="flex flex-col gap-8">
          {sections.map((s,i) => (
            i < revealed
              ? <Section key={i} s={s} />
              : (i === revealed ? <Generating key={i} /> : null)
          ))}

          {/* finance is the last block */}
          {revealed > sections.length && (
            <section className="anim-fadeup">
              <SectionHead title="7 · Finanzierungsplan" conf={93} />
              <FinanzTable grant={grant} />
            </section>
          )}
          {revealed === sections.length && <Generating />}
        </div>

        {done && (
          <footer className="anim-fadein mt-10 flex flex-wrap items-center justify-between gap-3 border-t border-cream-300 pt-6">
            <span className="brand-mono text-ink-500" style={{ fontSize:10, letterSpacing:'0.14em' }}>
              ERSTELLT MIT NOMOS · THE TRANSLATION ENGINE · POWERED BY TELOS
            </span>
            <button onClick={onReset} className="brand-mono text-terracotta hover:underline" style={{ fontSize:11, letterSpacing:'0.1em' }}>
              ↺ NEUES VORHABEN
            </button>
          </footer>
        )}
      </article>
    </main>
  );
}

function SectionHead({ title, conf }) {
  return (
    <div className="mb-3 flex items-center justify-between">
      <h2 className="font-sans" style={{ fontSize:19, fontWeight:600, letterSpacing:'-0.02em' }}>{title}</h2>
      <span className="brand-mono rounded-full bg-cream-200 px-2.5 py-1 text-ink-700" style={{ fontSize:10, letterSpacing:'0.1em' }}>
        KONFIDENZ {conf}%
      </span>
    </div>
  );
}

function Section({ s }) {
  return (
    <section className="anim-fadeup">
      <SectionHead title={s.t} conf={s.conf} />
      {s.body && <p className="text-[15px] leading-7 text-ink-700">{s.body}</p>}
      {s.list && (
        <ul className="flex flex-col gap-2">
          {s.list.map((li,i) => (
            <li key={i} className="flex gap-3 text-[15px] leading-7 text-ink-700">
              <span className="mt-2 h-1.5 w-1.5 flex-none rounded-full bg-terracotta" />
              <span>{li}</span>
            </li>
          ))}
        </ul>
      )}
    </section>
  );
}

function Generating() {
  return (
    <div className="flex items-center gap-3 text-ink-500">
      <span className="spin inline-flex"><NomosMark size={18} color="var(--ink-500)" /></span>
      <span className="brand-mono cursor" style={{ fontSize:12, letterSpacing:'0.1em' }}>Nomos formuliert</span>
    </div>
  );
}

/* ───────────────────────────── Footer ───────────────────────────── */

function Footer() {
  return (
    <footer className="no-print border-t border-cream-300 px-6 py-8 md:px-12">
      <div className="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4">
        <div className="flex items-center gap-3">
          <TelosLockup size={20} />
          <span className="brand-serif italic text-ink-700" style={{ fontSize:16 }}>From Vision to Grant. Seamlessly.</span>
        </div>
        <span className="brand-mono uppercase text-ink-500" style={{ fontSize:10, letterSpacing:'0.16em' }}>
          @telos · powered by Nomos · Berlin · Wien · Zürich
        </span>
      </div>
    </footer>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
